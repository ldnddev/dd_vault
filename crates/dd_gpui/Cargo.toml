[workspace]

[package]
name = "dd_gpui"
version = "0.1.13"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
description = "GPUI desktop shell for dd_vault"

[[bin]]
name = "dd_vault-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
dd_ai = { path = "../dd_ai" }
dd_edit = { path = "../dd_edit" }
dd_render = { path = "../dd_render" }
dd_vault_core = { path = "../dd_vault_core" }
gpui-unofficial = "=1.27.0"
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.27.0", features = [
    "wayland",
    "x11",
] }
ldnddev_theme = { path = "../ldnddev_theme" }
notify = "7"
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
